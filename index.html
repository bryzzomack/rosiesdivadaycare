  openModal(`<h2>🤲 Tummy Rub</h2>
    <p class="small">Swipe across her belly in the direction she demands (or use arrow keys). <b>She changes her mind.</b> ${MAX_MISS} mistakes and she calls Dad.</p>
    <div id="rubPad"><div class="rub-rosie rosie-wrap belly happy">${rosieSVG()}</div><div id="rubCue"></div><div id="rubSwipe">🤚</div><div id="rubTime"><i></i></div></div>
    <div id="rubStats"><span id="rubCount">Rub 0/${N}</span><span id="rubLives">${'💖'.repeat(MAX_MISS)}</span></div>
    <p id="rubMsg"><b>Rosie:</b> "${opts.line || pick(['Belly is up. Do NOT mess this up.', 'I will be giving directions. Follow them. Exactly.', 'This is a privilege. Act like it.'])}"</p>`);
  const pad = $('#rubPad'), cue = $('#rubCue'), bar = $('#rubTime i'), hand = $('#rubSwipe');
  const talk = m => { $('#rubMsg').innerHTML = `<b>Rosie:</b> "${m}"`; };
  let i = 0, miss = 0, want = null, fake = null, left = 0, limit = 0, last = performance.now(), raf, wait = 1.1, done = false, perfect = true, start = null;
  function next() {
    if (i >= N) return win();
    limit = 3.8 - (i / (N - 1)) * 1.3;
    left = limit;
    const keys = Object.keys(DIRS);
    want = pick(keys);
    fake = null;
    if (i >= 2 && Math.random() < 0.28) {               // fake-out: show one, then switch
      fake = { show: pick(keys.filter(k => k !== want)), at: limit - rand(0.35, 0.55) };
      cue.className = '';
      cue.innerHTML = `${DIRS[fake.show][0]}<small>${DIRS[fake.show][1]}</small>`;
    } else { cue.className = ''; cue.innerHTML = `${DIRS[want][0]}<small>${DIRS[want][1]}</small>`; }
  }
  function frame(now) {
    if (done) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (wait > 0) { wait -= dt; if (wait <= 0) next(); }
    else if (want) {
      left -= dt;
      if (fake && left <= fake.at) { fake = null; cue.className = 'fake'; cue.innerHTML = `${DIRS[want][0]}<small>😏 JK — ${DIRS[want][1]}</small>`; }
      bar.style.width = Math.max(0, left / limit * 100) + '%';
      if (left <= 0) mistake(pick(RUB_TIMEOUT));
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  function swipe(d) {
    if (done || !want || wait > 0) return;
    const shown = fake ? fake.show : want;
    hand.style.opacity = 0;
    if (fake && d === fake.show) return mistake(pick(['Ha! Changed my mind. Keep UP.', 'Psych. I never wanted that. Pay attention.', 'Gotcha. I am unpredictable. It\'s part of my charm.']));
    if (d !== want) return mistake(pick(RUB_WRONG[want]));
    i++;
    hearts(1);
    $('#rubCount').textContent = `Rub ${i}/${N}`;
    talk(pick(RUB_GOOD));
    cue.innerHTML = '✅'; want = null; wait = 0.45;
    void shown;
  }
  function mistake(line) {
    miss++; perfect = false;
    $('#rubLives').textContent = '💖'.repeat(Math.max(0, MAX_MISS - miss)) + '💔'.repeat(Math.min(miss, MAX_MISS));
    talk(line);
    cue.innerHTML = '❌'; want = null; fake = null;
    pad.classList.remove('jolt'); void pad.offsetWidth;
    if (miss >= MAX_MISS) return lose();
    wait = 1.2;
  }
  // pointer swipes
  pad.addEventListener('pointerdown', e => { e.preventDefault(); start = { x: e.clientX, y: e.clientY }; try { pad.setPointerCapture(e.pointerId); } catch (_) {} });
  pad.addEventListener('pointermove', e => {
    const r = pad.getBoundingClientRect();
    hand.style.left = e.clientX - r.left - 15 + 'px'; hand.style.top = e.clientY - r.top - 15 + 'px'; hand.style.opacity = 1;
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
    start = { x: e.clientX, y: e.clientY };
    swipe(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'L' : 'R') : (dy < 0 ? 'U' : 'D'));
  });
  ['pointerup', 'pointercancel'].forEach(t => pad.addEventListener(t, () => { start = null; }));
  const kd = e => { const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' }[e.code]; if (m) { e.preventDefault(); swipe(m); } };
  document.addEventListener('keydown', kd);
  function cleanup() { done = true; cancelAnimationFrame(raf); document.removeEventListener('keydown', kd); }
  function win() {
    cleanup();
    const pts = perfect ? 25 : 12;
    $('#modalCard').innerHTML = `<h2>${perfect ? '🏆 Flawless Rub' : '😌 Rub Accepted'}</h2><div class="mini-rosie rosie-wrap belly happy">${rosieSVG()}</div>
      <p><b>Rosie:</b> "${perfect ? pick(['…That was perfect. I hate that it was perfect. Tell no one.', 'Okay. You may be promoted from "staff" to "acceptable staff."']) : pick(['Decent. Not Dad-level. But decent.', 'A few mistakes. I\'ll only mention them forever.'])}"</p>
      <p><b>+${pts} 👑</b></p><button class="big" id="rubOk">She's melted 🫠</button>`;
    $('#rubOk').onclick = () => {
      closeModal();
      S.happy = clamp(S.happy + (perfect ? 35 : 25));
      if (evIs('rub')) endEvent(true);
      S.points += pts; floatPoints(pts);
      flashHappy(2500); hearts(6); showPhoto('belly');
      say(pick(['You may rub again later. Maybe.', 'I am a puddle now. A dignified puddle.', 'Okay that was nice. Tell no one. Ever.']));
      updateAll();
    };
  }
  function lose() {
    cleanup();
    $('#modalCard').innerHTML = `<h2>😾 Rub REJECTED</h2><div class="mini-rosie rosie-wrap refuse">${rosieSVG()}</div>
      <p><b>Rosie:</b> "${pick(['I have never been so disrespected in my LIFE. And I once saw a cat.', 'You rubbed me like you were sanding a deck. I\'m calling Dad.', 'That was assault. On my FEELINGS. Where is my phone.', 'Wrong. Way. I want a manager. I want DAD.'])}"</p>
      <p class="small">📱 She's already typing…</p><button class="big" id="rubOk">Brace yourself 😬</button>`;
    $('#rubOk').onclick = () => {
      closeModal();
      if (evIs('rub')) endEvent(false, true);
      S.happy = clamp(S.happy - 10);
      refuse();
      say(pick(['Don\'t touch me. I\'m texting.', 'Shh. I\'m composing a strongly worded message.', "Read receipts are ON. He's seen it."]));
      reportToDad('rub');
      updateAll();
    };
  }
}

rosie.addEventListener('pointerdown', e => {
  if (S.over || S.modalOpen) return;
  if (evIs('howl')) return calm('pat');
  if (S.busy === 'zoom') return catchZoom();
  if (S.userPaused || S.ev) return;
  if (Date.now() - lastPet > 4000) {
    lastPet = Date.now();
    S.happy = clamp(S.happy + 3);
    flashHappy(1200); hearts(2);
    say(pick(['Hm. Petting accepted.', 'You may continue.', 'Lower. LOWER. …The tummy, obviously.', "Careful. I'm a collector's item.", 'Did I say you could touch me? …Fine. Continue.', 'Two more pats and I might tolerate you.']));
    updateAll();
  }
});

/* =====================================================================
   Zoomies
   ===================================================================== */
function startZoomies() {
  S.busy = 'zoom';
  zoomCatches = 0;
  rosie.classList.remove('at-inside', 'at-mat', 'shiver', 'blanket', 'shades', 'dance', 'want');
  rosie.classList.add('zoom', 'happy');
  showPhoto('zoomies');
  const move = () => { rosie.style.left = rand(30, 78) + '%'; rosie.style.bottom = rand(4, 22) + '%'; if (Math.random() < 0.5) hearts(1, '💨'); };
  move();
  zoomIv = setInterval(move, 950);
}
function catchZoom() { if (S.busy !== 'zoom') return; zoomCatches++; hearts(2, '✋'); if (zoomCatches >= 2) endZoomies(true); }
function endZoomies(caught) {
  clearInterval(zoomIv);
  if (S.busy !== 'zoom') return;
  S.busy = null;
  rosie.classList.remove('zoom', 'happy');
  if (evIs('zoom')) endEvent(caught, !caught);
  if (!caught) S.potty = clamp(S.potty - 12);
  placeRosie();
  say(caught ? pick(['I was NOT zooming. You saw nothing.', "That wasn't zoomies. That was cardio. Mind your business."]) : '*collapses dramatically* Carry me to my chair.');
  updateAll();
}

/* =====================================================================
   Door, umbrella, blanket, pause
   ===================================================================== */
function doorAction() {
  if (evIs('howl')) {
    const why = S.ev.why;
    if (!why) return calm('pat');
    endEvent(false, true);
    S.loc = why === 'out' ? 'chair' : 'inside';
    S.points += 5; floatPoints(5);
    placeRosie();
    say(why === 'out' ? pick(['Oh, NOW the door works? Amazing.', 'Freedom. It only took the whole neighborhood.']) : pick(['Inside. Finally. Did the neighbors enjoy my concert?', 'Was that so hard? Apparently, yes.']));
    afterGearCheck(); updateAll();
    return;
  }
  if (blocked()) return;
  if (S.loc === 'inside') {
    S.loc = 'chair';
    if (evIs('out')) endEvent(true);
    placeRosie();
    if (S.leaves >= 10) say('Ahh, my throne. And… a pile of LEAVES. Wonderful.');
    else if (isComfy()) { say(pick(['FREEDOM. Thank you, staff.', 'Ahh. My throne.', 'Out. Good. Inside was getting boring.'])); flashHappy(); showPhoto('chair'); }
    afterGearCheck();
  } else {
    const asked = evIs('in');
    if (asked) endEvent(true);
    else if (S.ev) endEvent(false, true);                // going inside cancels whatever she was demanding out here
    S.loc = 'inside';
    say(asked ? pick(['Thank you. The couch and I have a standing appointment.', 'Ahh. Climate control. You may live.', 'See? You CAN listen. Gold star. A small one.',
      'Inside, as requested. As DESERVED.', 'Perfect timing. I was about to be outdoorsy for one second too long.', "Couch, here I come. Don't wait up."])
      : pick(['Inside? I didn\'t ask for inside. But fine. I want it noted.', "Oh, we're going in? Nobody consulted me.", "I'll be pressing my nose on the glass. Enjoy cleaning it."]));
  }
  placeRosie(); updateAll();
}
function afterGearCheck() { if (!S.ev && outside() && !isComfy()) startEvent('gear'); }
$('#btnDoor').onclick = doorAction;
$('#glassDoor').onclick = doorAction;
function gearChanged() {
  placeRosie();
  if (S.ev && (S.ev.type === 'weather' || S.ev.type === 'gear') && isComfy()) {
    const fast = S.ev.left >= S.ev.total * 0.6;
    endEvent(true);
    say(fast ? pick(['That was fast. Suspiciously competent.', 'Okay, Mr. Weatherman. I see you.']) : pick(['Took you long enough.', 'Finally. I was about to file paperwork.']));
    flashHappy();
  } else afterGearCheck();
  updateAll();
}
$('#btnUmbrella').onclick = () => {
  if (blocked()) return;
  S.umbrella = !S.umbrella;
  if (S.umbrella && S.weather === 'rainy') showPhoto('umbrella');
  if (S.umbrella && S.weather === 'sunny' && outside()) { say('Shade? The SUN is out. I came here to TAN.'); refuse(); }
  if (!S.umbrella && S.weather === 'rainy' && outside()) { say('You took my umbrella IN THE RAIN? Bold. Stupid, but bold.'); refuse(); }
  gearChanged();
};
$('#btnBlanket').onclick = () => {
  if (blocked()) return;
  S.blanket = !S.blanket;
  if (S.blanket && S.weather === 'sunny' && outside()) { say('A blanket? In THIS heat? Are you trying to bake me?'); refuse(); }
  else if (S.blanket) showPhoto('blanket');
  else if (S.weather === 'cold' && outside()) { say('WHO TOOK MY BLANKET. Name names.'); refuse(); }
  gearChanged();
};
$('#btnPause').onclick = () => {
  if (S.over) return;
  S.userPaused = !S.userPaused;
  $('#veil').classList.toggle('show', S.userPaused);
  if (S.userPaused) save();
  updateAll();
};

/* =====================================================================
   Howling → neighbors → police
   ===================================================================== */
const NEIGHBORS = ['👵', '👴', '🧔', '👩‍🦰', '👨‍🦳', '👩'];
const NEIGHBOR_LINES = ['Is that dog OKAY?!', 'Some of us work from home!', "Why is there a WOLF?", 'Rosie, PLEASE.', "Who's watching this dog??", 'My baby JUST fell asleep!', "I'm getting Rosie's dad's number…", 'Every. Single. Day.'];
function startHowlFx() {
  clearInterval(howlFx);
  howlFx = setInterval(() => {
    if (S.userPaused || S.modalOpen) return;
    const a = document.createElement('div'); a.className = 'awoo';
    a.textContent = pick(['AWOOOOO', 'AROOOO!', 'AWOO-OO-OO', 'HOOOWL', 'AROOO 🎶']);
    a.style.left = rosie.offsetLeft + rosie.offsetWidth * (0.1 + Math.random() * 0.5) + 'px';
    a.style.top = rosie.offsetTop + 'px';
    scene.appendChild(a); setTimeout(() => a.remove(), 1900);
  }, 700);
}
function stopHowlFx() { clearInterval(howlFx); howlFx = null; document.querySelectorAll('.neighbor').forEach(n => { n.classList.remove('up'); setTimeout(() => n.remove(), 400); }); }
function calm(kind) {
  if (!evIs('howl') || S.over || S.modalOpen) return;
  const lasted = S.ev.t;
  endEvent(false, true);
  if (kind === 'rub') { rubGame({ line: 'Belly rub accepted as an apology. Do it RIGHT and maybe I stop singing.' }); return; }
  S.happy = clamp(S.happy + (kind === 'hug' ? 8 : 4));
  S.points += kind === 'hug' ? 8 : 4;
  floatPoints(kind === 'hug' ? 8 : 4);
  flashHappy(1800);
  hearts(kind === 'hug' ? 5 : 2, kind === 'hug' ? '🤗' : '💖');
  say(lasted > 8 && kind === 'pat' ? `${lasted} seconds of howling. That's on you.` : kind === 'hug' ? pick(['Ugh. A hug. …Okay this is nice. Tell no one.', 'I am NOT melting. This is just the sun.']) : pick(['Oh. NOW you notice me.', "A pat. That's it? …Fine. Accepted."]));
  updateAll();
}
function policeArrive() {
  S.points = Math.max(0, S.points - 75);
  const cop = $('#cop'), siren = $('#siren');
  siren.classList.add('on');
  $('#copSays').textContent = pick(["Ma'am, we got a noise complaint.", 'Is this the famous Rosie?', 'We heard her from the station.']);
  cop.classList.add('in');
  note('🚓 The POLICE showed up for the howling! Noise ticket: −75 points.', 6000);
  floatPoints(-75);
  setTimeout(() => say(pick(['Oh, an audience! Officer, arrest THEM.', "I'd like to report neglect. Officer. OFFICER.", 'I was SINGING. Is that a crime now?'])), 1500);
  setTimeout(() => { $('#copSays').textContent = pick(['Keep it down, Rosie.', 'This is your one warning, pup.', "I'll be calling her dad."]); }, 3500);
  setTimeout(() => { cop.classList.remove('in'); siren.classList.remove('on'); if (!S.over) reportToDad('police'); }, 7000);
}
function neighborPop() {
  if (S.over || S.modalOpen) return;
  const n = document.createElement('div'); n.className = 'neighbor';
  n.innerHTML = `${pick(NEIGHBORS)}<span>${pick(NEIGHBOR_LINES)}</span>`;
  n.style.left = 30 + Math.random() * 30 + '%';
  $('#neighbors').appendChild(n);
  requestAnimationFrame(() => requestAnimationFrame(() => n.classList.add('up')));
  setTimeout(() => { n.classList.remove('up'); setTimeout(() => n.remove(), 400); }, 3200);
  S.points = Math.max(0, S.points - 5);
}

/* =====================================================================
   Treat jar + bribes
   ===================================================================== */
const TREATS = {
  cheese: { e: '🧀', name: 'Cheese cube', value: 1, mood: 6, line: ['A cheese cube. How quaint.', "Cheese. I'm listening."] },
  bacon:  { e: '🥓', name: 'Bacon strip', value: 2, mood: 10, line: ["Bacon? Now we're negotiating.", 'Bacon. You may live.'] },
  bully:  { e: '🦴', name: 'Bully stick', value: 3, mood: 15, line: ['A BULLY STICK. You understand power.', 'The good stuff. Finally, respect.'] },
};
const treatCount = () => S.treats ? Object.values(S.treats).reduce((a, b) => a + b, 0) : 0;
const CALL_REASON = { tummy: 'Reason for call: "STARVATION."', happy: 'Reason for call: "Emotional neglect."', comfort: 'Reason for call: "Hostile working conditions."' };
function treatButtons() { return Object.entries(TREATS).map(([k, t]) => `<button class="choice" data-treat="${k}" ${S.treats[k] ? '' : 'disabled'}>${t.e} ${t.name}<small>${S.treats[k]} left</small></button>`).join(''); }
$('#btnTreats').onclick = () => {
  if (blocked()) return;
  openModal(`<h2>🦴 Treat Jar</h2><p class="small">Treats keep her happy… but they're also your <b>hush money</b> if she tries to call Dad. Refills every few minutes.</p>
    <div class="choices">${treatButtons()}<button class="choice" data-treat="cancel">↩️ Save them</button></div>`);
  document.querySelectorAll('[data-treat]').forEach(b => b.onclick = () => {
    closeModal();
    const k = b.dataset.treat;
    if (k === 'cancel' || !S.treats[k]) return;
    const t = TREATS[k];
    S.treats[k]--; S.happy = clamp(S.happy + t.mood); S.tummy = clamp(S.tummy + 3);
    flashHappy(); hearts(2, t.e); say(pick(t.line)); updateAll();
  });
};
function startBribe(k) {
  const price = Math.min(8, 2 + S.bribes + S.strikes + Math.floor(Math.random() * 2));
  const RING = 8;
  let paid = 0, left = RING, done = false;
  openModal(`<h2>📱 Rosie is calling Dad!</h2><div class="phone">📱</div><p><b>${CALL_REASON[k]}</b></p>
    <p class="small">Bribe her with treats before he picks up!</p>
    <div class="bar" style="height:12px"><i id="ring" style="width:100%;background:#ff5a5a;transition:none"></i></div>
    <p class="small" style="margin-top:8px">🤐 Silence bought</p>
    <div class="bar" style="height:12px"><i id="silence" style="width:0;background:#5cc96b"></i></div>
    <div class="choices" id="treatBtns">${treatButtons()}</div>
    <p id="bribeMsg"><b>Rosie:</b> "${treatCount() ? 'Ring ring. Ring ring. *stares at you*' : 'Your treat jar is empty. I can smell weakness.'}"</p>
    <button class="link" id="letCall">Let her call. I accept my fate.</button>`);
  const talk = m => { $('#bribeMsg').innerHTML = `<b>Rosie:</b> "${m}"`; };
  const iv = setInterval(() => { left -= 0.1; $('#ring').style.width = Math.max(0, (left / RING) * 100) + '%'; if (left <= 0) fail(); }, 100);
  function bind() { document.querySelectorAll('#treatBtns [data-treat]').forEach(b => b.onclick = () => give(b.dataset.treat)); }
  bind();
  $('#letCall').onclick = fail;
  function give(t) {
    if (done || !S.treats[t]) return;
    const tr = TREATS[t];
    S.treats[t]--; paid += tr.value; S.tummy = clamp(S.tummy + 2);
    $('#treatBtns').innerHTML = treatButtons(); bind();
    $('#silence').style.width = Math.min(100, (paid / price) * 100) + '%';
    if (paid >= price) return succeed(t);
    const r = paid / price;
    if (!treatCount()) talk("That's all you've got? Dad's phone is STILL ringing…");
    else if (r < 0.34) talk(pick([`One ${tr.name.toLowerCase()}? For my SILENCE?`, "That's insulting. Keep going."]));
    else if (r < 0.67) talk(pick(['Getting warmer. Phone is still ringing…', "Go on. I'm listening."]));
    else talk(pick(['Almost. My paw is hovering over the button.', 'So close. One more and I forget his number.']));
  }
  function succeed(lastTreat) {
    done = true; clearInterval(iv);
    S[k] = Math.max(S[k], 35); S.bribes++;
    $('#modalCard').innerHTML = `<h2>📵 Call Ended</h2><p style="font-size:44px;margin:4px">${TREATS[lastTreat].e}😌</p>
      <p><b>Rosie:</b> "${pick(['…Hello? Dad? Wrong number. *click*', 'Dad? Oh, nothing. Butt-dialed. With my paw. Bye.', 'Hi Dad. Everything is fine. Totally fine. Bye.'])}"</p>
      <p class="small">Her silence cost ${price} treat point${price > 1 ? 's' : ''}. Her price goes up every time.</p>
      <button class="big" id="bribeOk">Phew 😅</button>`;
    $('#bribeOk').onclick = () => { closeModal(); flashHappy(); say(pick(['Pleasure doing business with you.', 'We never speak of this.'])); updateAll(); };
  }
  function fail() { if (done) return; done = true; clearInterval(iv); closeModal(); reportToDad(k); }
}

/* =====================================================================
   Game over
   ===================================================================== */
function headshotImg() { return `<img class="headshot" src="${PHOTOS.headshot}" alt="Rosie" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'mini-rosie rosie-wrap',innerHTML:rosieSVG()}))">`; }
function endGame(html) {
  S.over = true;
  S.ev = null;
  clearTimers(); clearSpeech(); renderEvent();
  saveBest(); clearSave();
  const b = best();
  openModal(`${html}<p>👑 Final score: <b>${S.points}</b> &nbsp; 🏆 Best: <b>${b}</b>${S.points >= b && S.points > 0 ? ' — NEW BEST!' : ''}</p>
    <button class="big" id="again">Try again</button>`);
  $('#again').onclick = newGame;
}
function gameOver() {
  endGame(`<h2>📱 Trip Cancelled!</h2>${headshotImg()}
    <p>Dad has read Rosie's 14-paragraph complaint (with photos). They're cutting the trip short and driving home.</p><p><b>Rosie has won.</b> She always wins.</p>`);
}

/* =====================================================================
   Title screen
   ===================================================================== */
(function showTitle() {
  const saved = loadSave();
  openModal(`<div class="marquee">${'<i></i>'.repeat(13)}</div>
    <div class="hero">${headshotImg()}<div class="crown">👑</div></div>
    <h2 class="title">Rosie's Diva Daycare</h2>
    <p class="tag">Mom & Dad are on vacation. You're the help. Rosie has demands, opinions, and Dad's phone number.</p>
    <ul class="rules">
      <li><span>💬</span><div>Watch her bubble: when she wants something it shows the <b>icon</b> to tap and a <b>countdown clock</b>. Tap the icon right in her bubble or the matching button below.</div></li>
      <li><span>🚪</span><div>Inside she just naps. She'll come to the glass when she wants out. Ignore her and she howls… then the neighbors… then the <b>police</b>.</div></li>
      <li><span>🥣</span><div>Feeding: hold to pour kibble and stop in the green. Then spin the topping wheel. 🔥 slices mean you grill it (raw = tummy trouble). 🙄 = her boycott.</div></li>
      <li><span>🤲</span><div>Tummy rubs: swipe the way she says. She changes her mind. Mess up and she texts Dad.</div></li>
      <li><span>💩</span><div>Walks: tap every poop before it scrolls away. If she plops down, tap her to carry her. Miss a potty emergency = <b>automatic fail</b>.</div></li>
      <li><span>🍂</span><div>Wind gusts bury the porch. Blow it clean, but don't blow Rosie.</div></li>
      <li><span>📱</span><div>If a meter hits zero she calls Dad. Bribe her with 🦴 treats. ${CONFIG.MAX_REPORTS} reports and it's game over.</div></li>
    </ul>
    <p class="small">🏆 Best score: ${best()}</p>
    ${saved ? `<button class="big" id="resume">Continue (👑 ${saved.points})</button><br><button class="link" id="start">Start over</button>` : '<button class="big" id="start">Start dog-sitting</button>'}`);
  $('#modalCard').classList.add('title-card');
  $('#start').onclick = newGame;
  if (saved) $('#resume').onclick = () => resumeGame(saved);
})();
</script>
